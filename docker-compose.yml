services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: k8s-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/indices:/app/data/indices

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: k8s-rag-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend